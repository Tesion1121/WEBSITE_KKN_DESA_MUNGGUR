services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: kkn_laravel_app
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - kkn-network

  web:
    image: nginx:alpine
    container_name: kkn_laravel_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - kkn-network
    depends_on:
      - app

  # Frontend container disabled - pages now served through Laravel Blade
  # frontend:
  #   image: nginx:alpine
  #   container_name: kkn_frontend
  #   restart: unless-stopped
  #   ports:
  #     - "3000:80"
  #   volumes:
  #     - ../frontend:/usr/share/nginx/html
  #     - ../frontend/nginx.conf:/etc/nginx/conf.d/default.conf
  #   networks:
  #     - kkn-network

  db:
    image: mysql:8.0
    container_name: kkn_laravel_db
    restart: unless-stopped
    tty: true
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel_db}
      MYSQL_USER: ${DB_USERNAME:-laravel_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-laravel_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - kkn-network

networks:
  kkn-network:
    driver: bridge

volumes:
  db_data:
    name: db_data
    driver: local
